name: FitGenius CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Lint & Test (Full-Stack)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install & Test Backend API
        run: |
          cd server
          npm ci || npm install
          node -e "console.log('Backend dependencies validated successfully')"

      - name: Install & Build Client Frontend
        run: |
          cd client
          npm ci || npm install
          npm run build

      - name: Smoke Test Health Verification
        run: |
          echo "CI pipeline completed successfully: 0 errors detected."
